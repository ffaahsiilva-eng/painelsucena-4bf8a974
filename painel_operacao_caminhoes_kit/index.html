<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Operação de Caminhões</title>
<style>
:root{--bg:#050607;--panel:#0b0d0f;--panel2:#111417;--red:#f1262d;--red2:#b90f16;--white:#f5f5f5;--muted:#999da2;--line:#363a3e;--radius:24px;--shadow:0 18px 40px rgba(0,0,0,.55),0 0 30px rgba(241,38,45,.05)}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 0,#17191b 0,#060708 27%,#000 72%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--white);min-height:100vh}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,rgba(12,14,15,.97),rgba(0,0,0,.99) 19%);box-shadow:0 0 50px rgba(0,0,0,.85)}
.header{height:86px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(241,38,45,.45);background:linear-gradient(180deg,#15181a,#0b0d0e);position:sticky;top:0;z-index:10}
.icon-btn{width:42px;height:42px;border:0;background:transparent;padding:8px;display:grid;place-items:center}.icon-btn img{width:100%;height:100%;object-fit:contain}.brand{display:flex;justify-content:center}.brand img{width:235px;max-width:100%;height:60px;object-fit:contain}
.main{padding:16px 18px 28px}.fuel-card{border:1px solid #3c4044;border-radius:26px;background:linear-gradient(180deg,#0d0f11,#080a0b);box-shadow:var(--shadow);padding:16px 15px 15px;margin-bottom:16px}.section-title{display:flex;align-items:center;justify-content:center;gap:11px;text-transform:uppercase;letter-spacing:3px;font-weight:750;font-size:13px}.section-title img{width:23px;height:23px}.fuel-card .gauge{display:block;width:100%;margin:7px auto -2px}.fuel-controls{display:grid;grid-template-columns:46px 1fr 46px;gap:16px;align-items:center;margin-top:-12px;padding:0 78px}.small-round{width:42px;height:42px;border-radius:14px;border:1px solid #23272a;background:linear-gradient(180deg,#191c1f,#0f1113);color:var(--red);font-size:28px}.value-pill{height:46px;border-radius:25px;border:1px solid #3a3e41;background:linear-gradient(180deg,#1d2023,#101214);display:grid;place-items:center;font-size:23px;font-weight:800}
.start-btn{height:72px;border-radius:26px;border:1px solid #ff3036;background:linear-gradient(180deg,#ed1f27,#b60f15);color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:15px;font-size:20px;font-weight:800;letter-spacing:1.2px;box-shadow:0 7px 24px rgba(241,38,45,.23), inset 0 1px 0 rgba(255,255,255,.15)}.start-btn span.play{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(92,0,4,.36);border:1px solid rgba(255,255,255,.12)}.start-btn img{width:24px;height:24px}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.status{height:88px;border:1px solid #3b3f43;background:linear-gradient(180deg,#15181b,#0c0e10);border-radius:22px;display:grid;grid-template-columns:56px 1fr 26px;align-items:center;padding:11px 12px;box-shadow:var(--shadow)}.status .bubble{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1d2023 10%,#111315 65%);box-shadow:0 0 15px rgba(241,38,45,.16),inset 0 0 0 1px rgba(241,38,45,.26)}.status .bubble img{width:30px;height:30px}.status .chev{width:22px;opacity:.9}.status strong{font-size:13px;display:block;letter-spacing:.6px}.status small{font-size:10px;color:var(--muted);display:block;margin-top:3px}.end-btn{margin-top:9px;height:64px;width:100%;border-radius:20px;border:1px solid rgba(241,38,45,.7);background:linear-gradient(180deg,#141719,#0b0d0f);color:#fff;font-size:17px;font-weight:800;letter-spacing:1px;display:flex;gap:12px;align-items:center;justify-content:center}.end-btn img{width:27px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.tile{aspect-ratio:1/1.05;border-radius:20px;border:1px solid #34383c;background:linear-gradient(180deg,#171a1d,#0d0f11);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}.tile:after{content:"";position:absolute;bottom:10px;width:24px;height:2px;border-radius:5px;background:var(--red)}.tile img{width:38px;height:38px}.tile span{text-align:center;font-weight:800;font-size:12px;line-height:1.15;letter-spacing:.6px;padding:0 6px}.tile:hover,.status:hover{transform:translateY(-1px);border-color:#5b5f62}.tile,.status,.start-btn,.end-btn,.small-round{transition:.16s ease;cursor:pointer}.tile:active,.status:active,.start-btn:active,.end-btn:active,.small-round:active{transform:scale(.98)}
@media(max-width:380px){.main{padding-left:12px;padding-right:12px}.fuel-controls{padding:0 48px}.status{grid-template-columns:48px 1fr 20px}.status .bubble{width:46px;height:46px}.status strong{font-size:11px}.status small{font-size:9px}.tile span{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><button class="icon-btn"><img src="assets/icons/svg/menu.svg"></button><div class="brand"><img src="assets/icons/svg/brand_logo.svg"></div><button class="icon-btn"><img src="assets/icons/svg/bell.svg"></button></header>
<main class="main">
<section class="fuel-card"><div class="section-title"><img src="assets/icons/svg/fuel.svg"><span>Nível de combustível</span></div><img class="gauge" src="assets/icons/svg/fuel_gauge.svg"><div class="fuel-controls"><button class="small-round" id="prev">‹</button><div class="value-pill" id="fuelText">1/2</div><button class="small-round" id="next">›</button></div></section>
<button class="start-btn"><span class="play"><img src="assets/icons/svg/play.svg"></span>INICIAR TURNO</button>
<section class="status-grid">
<div class="status"><span class="bubble"><img src="assets/icons/svg/wrench.svg"></span><div><strong>SERVIÇOS</strong><small>Manutenção e apoio</small></div><img class="chev" src="assets/icons/svg/chevron.svg"></div>
<div class="status"><span class="bubble"><img src="assets/icons/svg/clock.svg"></span><div><strong>AGUARDANDO</strong><small>Em espera</small></div><img class="chev" src="assets/icons/svg/chevron.svg"></div>
<div class="status"><span class="bubble"><img src="assets/icons/svg/rain.svg"></span><div><strong>CHUVA</strong><small>Condições climáticas</small></div><img class="chev" src="assets/icons/svg/chevron.svg"></div>
<div class="status"><span class="bubble"><img src="assets/icons/svg/utensils.svg"></span><div><strong>ALMOÇO</strong><small>Intervalo</small></div><img class="chev" src="assets/icons/svg/chevron.svg"></div>
</section>
<button class="end-btn"><img src="assets/icons/svg/power.svg">FIM DE TURNO</button>
<section class="menu-grid">
<div class="tile"><img src="assets/icons/svg/report.svg"><span>RELATÓRIOS</span></div><div class="tile"><img src="assets/icons/svg/equipment.svg"><span>EQUIPAMENTOS</span></div><div class="tile"><img src="assets/icons/svg/water.svg"><span>PONTOS DE ÁGUA</span></div>
<div class="tile"><img src="assets/icons/svg/exit.svg"><span>ENTRADA/SAÍDA</span></div><div class="tile"><img src="assets/icons/svg/checklist.svg"><span>CHECKLIST</span></div><div class="tile"><img src="assets/icons/svg/pump.svg"><span>ABASTECIMENTO</span></div>
</section>
</main>
</div>
<script>
const vals=['1/4','1/2','3/4'];let i=1;const t=document.getElementById('fuelText');
prev.onclick=()=>{i=(i+vals.length-1)%vals.length;t.textContent=vals[i]};next.onclick=()=>{i=(i+1)%vals.length;t.textContent=vals[i]};
</script>
</body></html>
