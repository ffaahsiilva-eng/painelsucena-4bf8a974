<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sucena - Offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{max-width:420px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:32px;backdrop-filter:blur(10px)}
  h1{font-size:24px;margin-bottom:12px;background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  p{opacity:.8;line-height:1.5;margin-bottom:20px;font-size:14px}
  button{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;border:0;padding:12px 28px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
  .icon{font-size:48px;margin-bottom:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Você está offline</h1>
    <p>Sem conexão no momento. O Painel do Motorista funciona offline — outras páginas voltam quando a internet retornar.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
